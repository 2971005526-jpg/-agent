/* ===== Visual refresh · production-design styling only ===== */
:root{
  --accent:#2f63f6;
  --accent-strong:#1f54ee;
  --accent-soft:#edf2ff;
  --ink:#151c2b;
  --ink-2:#3d4758;
  --muted:#8a94a6;
  --line:#e8ebf1;
  --surface:#fff;
  --canvas:#f5f6f8;
  --danger:#f04438;
  --shadow-card:0 3px 12px rgba(22,34,56,.055);
  --radius-card:14px;
  color:var(--ink);
  background:var(--canvas)
}
html{background:var(--canvas)}
body{background:var(--canvas);color:var(--ink);font-weight:400;-webkit-font-smoothing:antialiased}
.shell{background:var(--canvas);box-shadow:0 0 0 1px rgba(18,27,42,.035),0 18px 60px rgba(20,35,60,.08)}
header{height:68px;padding:0 18px;border-color:var(--line);background:rgba(255,255,255,.97);backdrop-filter:blur(18px)}
header strong{font-size:19px;font-weight:750;letter-spacing:0;color:var(--ink)}
header small{color:var(--muted);letter-spacing:0}
.back{color:#4f617c;font-weight:550}
.page{padding:20px 16px 126px;color:var(--ink)}
h1{font-size:27px;line-height:1.32;font-weight:750;letter-spacing:-.7px;color:var(--ink)}
h2{font-weight:700;color:var(--ink)}
h3{font-weight:650;color:var(--ink)}
p{line-height:1.65}.muted{color:var(--muted)}.mini,.home-caption,.footer-info{color:#9aa3b1}
button{transition:transform .16s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease}
button:active:not(:disabled){transform:scale(.975)}
button:focus-visible,a:focus-visible{outline:2px solid #91adff;outline-offset:2px}
.primary,.secondary{min-height:46px;border-radius:12px;font-weight:650}
.primary{background:var(--accent);box-shadow:0 6px 14px rgba(47,99,246,.18)}
.primary:hover{background:var(--accent-strong)}
.secondary{background:var(--accent-soft);color:var(--accent)}
.text{color:var(--accent);font-weight:550}
.card{border:1px solid var(--line);border-radius:var(--radius-card);background:#fff;box-shadow:var(--shadow-card)}
.soft{background:#f7f8fb}
.chip,.tag{background:var(--accent-soft);color:#4167b1;border-radius:7px}
.chip.on{background:var(--accent);color:#fff}
input,select,textarea{border:1px solid #e3e7ee;border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,30,52,.025)}
input:focus,select:focus,textarea:focus{outline:2px solid #a9bdff;border-color:#8eabff}
.price,.booking-cost{color:var(--danger)!important;font-weight:750}
.toast{bottom:112px;background:#1f2a3d;color:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(8,18,35,.22)}

/* Global bottom navigation */
.bottom{padding:10px 12px max(10px,env(safe-area-inset-bottom));border-color:var(--line);background:rgba(255,255,255,.96);box-shadow:0 -7px 24px rgba(30,44,68,.055);backdrop-filter:blur(18px)}
.nav{min-height:58px;align-items:flex-end}
.nav button{min-height:54px;color:#a1a9b6;font-size:11px;font-weight:500;padding:4px;gap:5px}
.nav svg{width:22px;height:22px;stroke-width:1.75}
.nav .active{color:var(--accent);font-weight:650}
.nav .dong{width:58px;height:58px;margin:-28px 0 0;border:4px solid #fff;background:var(--accent);box-shadow:0 6px 18px rgba(47,99,246,.3)}
.nav .dong svg{width:32px;height:32px;stroke:#fff}
.nav button:has(.dong)>span:last-child{font-size:11px;color:#30394a;font-weight:650;letter-spacing:0}
.nav button:hover .dong,.nav button.active .dong{background:var(--accent-strong);box-shadow:0 7px 20px rgba(47,99,246,.34)}

/* Home and recommendation feed */
.home-page{padding-top:14px}.home-top{align-items:center;margin-bottom:16px}.home-top h1{font-size:22px;font-weight:750;color:var(--ink)}
.avatar{width:38px;height:38px;border-radius:11px;border:0;background:var(--accent-soft)}
.avatar .dong-mark{stroke:var(--accent)}
.service-panel{margin:0 -16px;padding:15px 12px 18px;border-color:var(--line);background:#fff}
.service-grid{gap:7px;overflow:hidden}.service-grid button{gap:7px}.service-grid button>span,.service-grid button:first-child>span{width:48px;height:48px;border-radius:13px;background:#eef3ff;color:var(--accent)}
.service-grid svg{width:24px;height:24px;stroke-width:1.75}.service-grid strong{font-size:12px;color:#30394a}
.talk{padding:17px;border:1px solid #dde6ff;border-radius:16px;background:linear-gradient(135deg,#f3f6ff,#edf3ff);box-shadow:0 5px 18px rgba(47,99,246,.07)}
.talk p{font-size:15px;line-height:1.65}.talk-head{margin-bottom:10px}.talk-head strong{color:#294b9b;font-weight:700}
.weekly{margin-top:18px}.weekly-label>span:first-child,.feed-heading h2{font-size:17px;font-weight:700;color:var(--ink)}
.weekly .home-photo,.home-photo{height:226px;border-radius:14px;box-shadow:var(--shadow-card)}
.home-photo h2{font-size:22px}.home-photo button{color:var(--ink);font-weight:650;padding:8px 14px}
.community{margin:0 -16px -10px;padding:20px 12px;background:var(--canvas)}
.feed-columns{gap:10px}.feed-card{border:1px solid #eceef2;border-radius:12px;box-shadow:var(--shadow-card)}
.feed-image{height:190px}.feed-image>span{border-radius:5px;font-size:10px}.feed-card h3{font-size:14px;line-height:1.5;margin:9px 10px 7px;color:#242c3a}.feed-author{padding:0 9px 10px}.username,.like span{font-size:10px}.user-avatar{width:20px;height:20px}

/* Dongdong conversation */
.dong-conversation{padding-bottom:84px}.chat-empty h1{font-size:25px}.chat-label{font-size:12px;color:#a0a8b5}
.chat-message{max-width:90%;padding:13px 15px;border-radius:5px 16px 16px;background:#fff;color:#3d4758;border:1px solid #eceef3;box-shadow:0 2px 8px rgba(20,34,56,.035);font-size:15px;line-height:1.65}
.chat-message.user{max-width:86%;border:0;border-radius:16px 5px 16px 16px;background:#e8efff;color:#24488f;box-shadow:none}

function render(){const flow=['conditions','plan','offers','review'];$('#head').innerHTML=flow.includes(screen)?`<button class="back" onclick="go('${{conditions:'idea',plan:'conditions',offers:'plan',review:'offers'}[screen]}')">‹ 返回</button><strong style="font-size:17px">${{conditions:'出行条件',plan:'成都四天',offers:'选择机酒',review:'确认行程'}[screen]}</strong><span class="mini">示例</span>`:screen==='home'?homeSearchHeader():`<strong><span class="brand-dot">京旅</span><small>让心动，成为下一程</small></strong><span class="mini">北京出发</span>`;$('#steps').innerHTML=flow.includes(screen)?`<div class="steps">${['1 出行条件','2 安排行程','3 选择机酒','4 确认保存'].map((t,i)=>`<span class="${flow.indexOf(screen)===i?'on':''}">${t}</span>`).join('')}</div>`:'';$('#app').innerHTML=`<section class="page ${screen==='home'?'home-page':''} ${screen}-page">${views[screen]()}</section>`;$('#bottom').innerHTML=foot();}
const views={home:()=>`<div class="eyebrow">YOUR NEXT LITTLE GETAWAY</div><h1>给生活，留几天假。</h1><div class="hero"><img src="${pictures.chengdu}" alt="成都旅行风景"><div class="copy"><span class="eyebrow" style="color:#e6edff">城市慢游 / CHENGDU</span><h1>喝碗茶，<br>再决定下一站。</h1><p>成都四天 · 看熊猫，也留时间发呆</p></div></div>${button('以这趟成都旅行开始 →',"go('idea')")}<h2 class="gap">从一个想法开始</h2><p class="muted">想去哪里、想怎么过，都可以先说说。还没确定的，我们一起补齐。</p><div class="chips"><button class="chip" onclick="preset('带孩子去成都玩四天，节奏轻松一点。')">带孩子看熊猫</button><button class="chip" onclick="preset('成都四天，喝茶逛街，多留一点自由时间。')">喝茶逛街，不赶路</button></div><p class="footer-info">本版先体验成都四天主流程</p>`,
idea:()=>`<span class="eyebrow">LET’S MAKE A PLAN</span><h1>这次，想怎么旅行？</h1><p class="muted">先说想法，不用一次想清楚所有细节。</p><label for="idea">你的旅行想法</label><textarea id="idea">${esc(state.idea)}</textarea><div class="chips"><button class="chip" onclick="document.getElementById('idea').value='带孩子去成都玩四天，别太赶。'">亲子慢游</button><button class="chip" onclick="document.getElementById('idea').value='成都四天，想看熊猫和逛老街。'">熊猫与老街</button></div><div class="card soft"><h3>我们先从成都四天开始</h3><p class="muted">下一步确认日期和人数，再给你一份可以调整的安排。</p></div><p class="mini">本版使用固定示例行程，尚未接入真实 AI。</p>`,
conditions:()=>`<span class="eyebrow">01 / YOUR TRIP</span><h1>确认几件小事。</h1><p class="muted">${esc(state.idea)}</p><label for="origin">出发城市</label><select id="origin"><option>北京</option></select><p class="mini">本轮先用北京往返成都验证流程。</p><label for="start">开始游玩的日期 · 共 4 天</label><input id="start" type="date" value="${state.start}"><div class="grid"><div><label for="people">成人</label><select id="people">${[1,2,3,4].map(n=>`<option ${state.people===n?'selected':''} value="${n}">${n} 人</option>`).join('')}</select></div><div><label for="rooms">房间</label><select id="rooms">${[1,2,3,4].map(n=>`<option ${state.rooms===n?'selected':''} value="${n}">${n} 间</option>`).join('')}</select></div></div><label for="budget">机酒总预算 · 所有人合计</label><input id="budget" type="number" min="1" value="${state.budget}"><p class="mini">餐饮、景点门票与当地交通另计；儿童价格本轮暂未演示。</p><label>旅行节奏</label><div class="chips">${['轻松一点','多逛一些'].map(t=>`<button class="chip ${state.pace===t?'on':''}" onclick="setPace('${t}')">${t}</button>`).join('')}</div><div id="error" class="error"></div>`,
plan:()=>`<div class="row"><span class="eyebrow">02 / THE ITINERARY</span><button class="text" onclick="go('conditions')">修改条件</button></div><h1>成都，慢慢玩四天。</h1><p class="muted">${date(0)} — ${date(3)} · ${state.people} 位成人 · ${state.pace}</p><div class="card soft"><h3>每天围绕一个区域安排</h3><p class="muted">熊猫基地单独留半天，武侯祠与锦里放在一起。首尾两天预留抵达和返程时间。</p></div><div class="row gap"><h2 style="margin:0">每天的安排</h2><button class="text" onclick="edit=!edit;render()">${edit?'完成调整':'调整景点'}</button></div>${days.map((d,i)=>`<section class="day"><span class="daynum">DAY 0${i+1} · ${date(i)}</span><h3 style="margin-top:10px">${d.name}</h3>${d.stops.map((x,j)=>stop(x,i+'-'+j)).join('')}${i===1&&state.pace==='多逛一些'?stop(['16:00','东郊记忆','休息后再出门 · 约 1.5 小时'],'extra'):''}</section>`).join('')}<p class="mini gap">时间用于展示安排节奏，未查询实时交通与景区开放信息。</p>`,
offers:()=>`<span class="eyebrow">03 / STAY & TRAVEL</span><h1>把出发，也安排好。</h1><p class="muted">${state.people} 人 · ${state.rooms} 间房 · 机酒预算 ¥${state.budget.toLocaleString()}</p><h2 class="gap">去程</h2>${flights.map((f,i)=>offer('out',i,f,`${date(i===2?-1:0)} · ${f.time}`,`${f.port} · 单人含税 ¥${f.price}`)).join('')}<h2 class="gap">返程 · ${date(3)}</h2>${returns.map((f,i)=>offer('back',i,f,f.time,`${f.port} · 单人含税 ¥${f.price}`)).join('')}<h2 class="gap">住在哪里</h2>${state.out===2?'<p class="notice">提前一晚抵达，入住日期已提前，住宿和总价同步增加为 4 晚。</p>':''}${hotels.map((h,i)=>offer('hotel',i,h,h.desc,`${date(state.out===2?-1:0)} 入住 · ${nights()} 晚 · ¥${h.price} / 间 / 晚`)).join('')}<p class="notice">${total()>state.budget?`当前超出机酒预算 ¥${total()-state.budget}，可以调整选择，或返回修改预算。`:`当前比机酒预算少 ¥${state.budget-total()}。`}</p><details><summary>关于价格与退改规则</summary><p class="muted">航班、酒店与价格均为示例，未查询库存。真实下单前需确认最终价格、房型、行李额和退改条款。</p></details>`,
review:()=>`<span class="eyebrow">04 / READY WHEN YOU ARE</span><h1>这趟旅行，先存好。</h1><p class="muted">保存后可以继续修改。保存行程不会产生订单。</p><div class="card"><div class="row"><h3>成都四天慢旅行</h3><button class="text" onclick="go('plan')">改行程</button></div><p class="muted">${date(0)} — ${date(3)} · ${state.people} 人</p><p class="muted">${state.pace} · ${state.removed.length?`已移除 ${state.removed.length} 项安排`:'保留完整路线'}</p></div><div class="card"><div class="row"><h3>机酒意向清单</h3><button class="text" onclick="go('offers')">改机酒</button></div><p>${date(state.out===2?-1:0)} · ${flights[state.out].name}</p><p class="muted">${flights[state.out].time} / 北京 → 成都</p><p>${date(3)} · ${returns[state.back].name}</p><p class="muted">${returns[state.back].time} / 成都 → 北京</p><p>${hotels[state.hotel].name}</p><p class="muted">${date(state.out===2?-1:0)} 入住 · ${nights()} 晚 · ${state.rooms} 间</p></div><div class="row"><span>机酒示例合计</span><span class="price">¥${total().toLocaleString()}</span></div><p class="muted">机票 ¥${(flights[state.out].price+returns[state.back].price)*state.people} + 酒店 ¥${hotels[state.hotel].price*nights()*state.rooms}</p><p class="notice gap">${total()>state.budget?'当前组合超出预算。保存仅保留意向，后续仍可调整。':'价格与库存尚未确认，本版不进行下单或支付。'}</p>`,
success:()=>`<div class="empty"><div class="check">✓</div><h1>下一程，有着落了。</h1><p class="muted">${state.stage==='options'?'成都行程和机酒意向':'成都行程草稿'}已保存到此浏览器，随时回来继续安排。</p><span class="tag gap">已保存 · 未预订</span></div>${button('查看我的行程',"go('trips')")}`,
trips:()=>`<span class="eyebrow">YOUR UPCOMING DAYS</span><h1>我的行程</h1>${state.saved?`<div class="card"><img class="cover-small" src="${pictures.chengdu}" alt="成都"><div class="row"><span class="tag">${state.stage==='options'?'机酒已选择 · 未预订':'行程草稿 · 机酒待选择'}</span><span class="mini">保存在此浏览器</span></div><h2 style="margin:16px 0 8px">成都四天慢旅行</h2><p class="muted">${date(0)} — ${date(3)} · ${state.people} 人</p><div class="grid gap">${button('查看行程',"go('plan')",true)}${button(state.stage==='options'?'查看机酒':'选择机酒',"go('offers')")}</div></div>`:`<div class="empty"><h2>下一程，从这里开始。</h2><p class="muted">保存的行程会出现在这里。</p></div>${button('规划一趟成都旅行',"go('idea')")}`}`};
function stop(x,id){let removed=state.removed.includes(id);if(removed&&!edit)return '';return `<div class="stop" style="${removed?'opacity:.45':''}"><time>${x[0]}</time><div><h3>${x[1]}</h3><p>${x[2]}</p></div>${edit?`<button onclick="toggleStop('${id}')">${removed?'恢复':'移除'}</button>`:''}</div>`}function toggleStop(id){state.removed=state.removed.includes(id)?state.removed.filter(x=>x!==id):[...state.removed,id];if(state.saved)persist();render()}
function offer(type,i,f,line,desc){return `<button class="card offer ${state[type]===i?'chosen':''}" aria-pressed="${state[type]===i}" onclick="choose('${type}',${i})"><span class="pick">${state[type]===i?'●':'○'}</span><h3>${f.name}</h3><p>${line}</p><p class="muted">${desc}</p></button>`}function choose(type,i){state[type]=i;render()}function preset(t){state.idea=t;go('idea')}function setPace(t){capture();state.pace=t;render()}function capture(){state.start=$('#start').value;state.people=+$('#people').value;state.rooms=+$('#rooms').value;state.budget=+$('#budget').value}function conditions(){capture();if(!state.start||state.start<'2026-09-11'||!Number.isFinite(state.budget)||state.budget<=0){$('#error').textContent='请填写有效的出行日期（9 月 11 日及以后）和机酒预算。';return}go('plan')}function save(stage){state.saved=true;state.stage=stage;if(persist())go('success')}function foot(){if(screen==='idea')return button('下一步：确认出行条件',"state.idea=document.getElementById('idea').value.trim()||state.idea;go('conditions')");if(screen==='conditions')return button('生成成都四天示例行程',"conditions()");if(screen==='plan')return `<div class="grid">${button('先存为草稿',"save('draft')",true)}${button('下一步：选择机酒',"go('offers')")}</div>`;if(screen==='offers')return `<div class="row"><div><span class="mini">${state.people} 人 · ${state.rooms} 间 · ${nights()} 晚</span><div class="price">¥${total().toLocaleString()}</div></div><div style="flex:1;max-width:200px">${button('下一步：确认行程',"go('review')")}</div></div>`;if(screen==='review')return button('保存行程与机酒意向',"save('options')");return nav()}

let dialogue=[];
function chatForm(id,placeholder){return `<form class="chat-form" onsubmit="event.preventDefault();sendDong('${id}')"><input id="${id}" aria-label="和东东聊旅行" placeholder="${placeholder}" autocomplete="off"><button aria-label="发送旅行想法" type="submit">↑</button></form>`}
function startChat(text){dialogue.push({role:'user',text});dialogue.push({role:'assistant',text:'好呀，我们把这趟旅行慢慢安排起来。你想从北京出发吗？大概有几天假，和谁一起去？不确定也没关系，可以先聊聊你想怎么玩。'});go('dongdong')}
function sendDong(id){const input=document.getElementById(id),text=input.value.trim();if(!text)return;if(screen!=='dongdong'){startChat(text);return}dialogue.push({role:'user',text});dialogue.push({role:'assistant',text:'记下了。我们先拿成都四天做个参考：一天逛老街喝茶，半天看熊猫，其余时间留给休息和闲逛。你更想多看几个地方，还是多留些自由时间？',plan:true});input.value='';render()}
views.home=()=>`<div class="home-top"><div><span class="eyebrow">FRIDAY / 下一程灵感</span><h1>最近，想出去走走吗？</h1></div></div><section class="talk"><div class="talk-head"><span class="avatar"><svg class="dong-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 19.3 12.7 28.5 16 19.3 19.3 16 28.5 12.7 19.3 3.5 16 12.7 12.7Z"/></svg></span><div><strong>东东</strong><div class="mini">你的旅行搭子</div></div></div><p>想去哪儿，或者只是想放个假，<br>都可以和我聊聊。</p><p class="muted">还没想好？从你现在的心情开始也行。</p>${chatForm('home-chat','比如：找个地方住两晚，别太赶')}<div class="chips" style="margin-bottom:0"><button class="suggestion" onclick="startChat('周末想出去透透气，有什么推荐？')">周末想透透气</button><button class="suggestion" onclick="startChat('带孩子玩四天，想看熊猫。')">带孩子看熊猫</button><button class="suggestion" onclick="startChat('预算 3000 元，想轻松玩几天。')">3000 元怎么安排</button></div></section><section class="home-section"><div class="row"><h2 style="margin:0">这一程，慢一点</h2><span class="eyebrow">本周灵感</span></div><div class="home-photo"><img src="${pictures.chengdu}" alt="成都旅行风景"><div class="copy"><span style="font-size:12px;letter-spacing:2px">成都 / 4 天慢游</span><h2>喝碗茶，再看世界。</h2><p>逛老街、看熊猫，给发呆留个下午。</p><button onclick="startChat('想按这份成都四天慢游来安排，帮我看看。')">和东东聊聊这趟旅行 ↗</button></div></div></section><section class="home-section"><h2>也许，你想这样过几天</h2><div class="inspiration"><button onclick="startChat('想去大理，在洱海边住两晚。')"><img src="${pictures.dali}" alt="大理旅行风景"><h3>住到洱海边，把闹钟关掉。</h3><span class="muted">大理 · 山水之间</span></button><button onclick="startChat('想去西安，逛老街吃当地小吃。')"><img src="${pictures.xian}" alt="西安旅行风景"><h3>在老街里，找一顿好吃的。</h3><span class="muted">西安 · 城市漫游</span></button></div></section><p class="home-caption">旅行灵感示例 · 对话为演示回复</p>`;
views.dongdong=()=>`<div class="talk-head"><span class="avatar"><svg class="dong-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 19.3 12.7 28.5 16 19.3 19.3 16 28.5 12.7 19.3 3.5 16 12.7 12.7Z"/></svg></span><div><h2 style="margin:0">东东</h2><span class="mini">一起把旅行聊明白</span></div></div>${dialogue.length?dialogue.map(m=>`<div class="chat-label" style="${m.role==='user'?'text-align:right':''}">${m.role==='user'?'你':'东东'}</div><div class="chat-message ${m.role==='user'?'user':''}">${esc(m.text)}${m.plan?`<div class="chat-preview"><h3>成都 · 四天慢游参考</h3><p>老街喝茶 / 熊猫基地 / 城市闲逛<br>日期、同行人和预算还可以继续聊。</p><button onclick="state.idea=dialogue.filter(x=>x.role==='user').map(x=>x.text).join('；');go('conditions')">查看并完善这份示例行程 →</button></div>`:''}</div>`).join(''):`<div class="chat-empty"><h1>你好呀，我是东东。</h1><p class="muted">告诉我一个想去的地方、一种心情，<br>我们就从那里开始。</p></div>`}<p class="mini gap">当前为对话交互演示，未接入真实 AI。</p>`;

function queryService(){let dest=document.getElementById('svc-dest').value.trim(),date=document.getElementById('svc-date').value,origin=document.getElementById('svc-origin')?.value.trim(),end=document.getElementById('svc-end')?.value;if(!dest||origin===''||(origin&&origin===dest)||end&&end<=date){document.getElementById('svc-error').textContent=end&&end<=date?'离店日期需晚于入住日期。':'请填写有效且不同的出发地与目的地。';return}document.getElementById('svc-error').textContent='';serviceQuery={dest,date,origin,end};document.getElementById('svc-result').innerHTML=`<div class="card"><span class="tag">查询条件已确认</span><h3 class="gap">${esc(origin?origin+' → '+dest:dest)}</h3><p class="muted">${esc(date)}${end?' — '+esc(end):''}</p><p class="muted">${serviceType}查询入口已准备好，商品结果将在接入服务后展示。</p></div>`}

let aiBusy=false,aiProgress=0;
const aiProgressLabels=['正在整理四天出游建议…','正在对比城市玩法与旅行节奏…','正在组织目的地推荐…'];
function isHolidayAsk(text){return /十一|国庆/.test(text)&&/4|四/.test(text)&&/去哪|哪里|推荐/.test(text)}
const cityRecommendations=[{name:'成都',reason:'<b>松弛烟火</b>的慢生活<br>喝茶发呆、看熊猫<br>适合不赶路的假期',fun:'大熊猫基地、宽窄巷子<br>锦里、太古里<br>钵钵鸡、火锅、甜水面'}, {name:'大理',reason:'<b>山水之间</b>的自然风光<br>洱海边散步、看日落<br>适合朋友一起放空',fun:'洱海、双廊古镇<br>苍山、喜洲<br>乳扇、破酥粑粑'}, {name:'西安',reason:'<b>千年长安</b>的历史人文<br>老街与古建筑很出片<br>亲子、人文都合适',fun:'兵马俑、西安城墙<br>大唐不夜城<br>肉夹馍、油泼面'}];
function recommendationMarkup(){return `<section class="ai-recommend"><div class="ai-byline">✧ <strong>东东为你推荐</strong></div><h1>十一四天，按城市帮你挑几个好去处。</h1><p class="muted">先挑了三座风格不同的城，<br>看看哪一种假期，更合你的心意。</p><div class="city-compare"><table><thead><tr><th>地点</th><th>推荐理由</th><th>吃喝玩乐有什么</th></tr></thead><tbody>${cityRecommendations.map(c=>`<tr><td><button onclick="askDong('${c.name}四天怎么安排？')">${c.name}</button></td><td>${c.reason}</td><td>${c.fun}</td></tr>`).join('')}</tbody></table></div><p class="muted recommendation-followup">有感兴趣的城市，或者其他要求，都可以告诉我，我们再一起把行程细化。</p><div class="ai-followups">${['成都亲子游详细路线','大理洱海环线怎么安排','西安适合儿童的博物馆推荐'].map(t=>`<button onclick="askDong('${t}')"><span>✧</span>${t}</button>`).join('')}</div></section>`}
const earlierDongView=views.dongdong;
views.dongdong=()=>{if(!dialogue.length&&!aiBusy)return `<div class="chat-empty"><div class="avatar" style="margin-bottom:24px"><svg class="dong-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 19.3 12.7 28.5 16 19.3 19.3 16 28.5 12.7 19.3 3.5 16 12.7 12.7Z"/></svg></div><h1>你好呀，我是东东。</h1><p class="muted">想去哪儿玩，我们一起想想。</p><button class="suggestion gap" onclick="askDong('十一有4天，去哪儿玩？')">十一有4天，去哪儿玩？</button><button class="suggestion" style="margin-top:12px" onclick="askDong('成都亲子游详细路线')">成都亲子游详细路线</button><button class="suggestion" style="margin-top:12px" onclick="askDong('从北京出发，10月1日至4日，2位大人、2位孩子')">帮我搭配成都机酒</button></div>`;return `<div class="dong-conversation">${dialogue.map(m=>m.type==='recommendation'?recommendationMarkup():`<div class="chat-label" style="${m.role==='user'?'text-align:right':''}">${m.role==='user'?'你':'东东'}</div><div class="chat-message ${m.role==='user'?'user':''}">${esc(m.text)}${m.plan?`<div class="chat-preview"><h3>成都 · 四天慢游参考</h3><p>老街喝茶 / 熊猫基地 / 城市闲逛</p><button onclick="go('conditions')">完善这份示例行程 →</button></div>`:''}</div>`).join('')}${aiBusy?`<div class="ai-working" role="status" aria-live="polite"><span class="thinking-star">✧</span><div><strong>${aiProgressLabels[aiProgress]}</strong><p>东东正在准备回复<span class="thinking-dots">···</span></p></div></div>`:''}</div>`};
function askDong(text){if(aiBusy)return;dialogue.push({role:'user',text});screen='dongdong';aiBusy=true;aiProgress=0;render();setTimeout(()=>{aiProgress=1;if(screen==='dongdong')render()},650);setTimeout(()=>{aiProgress=2;if(screen==='dongdong')render()},1450);setTimeout(()=>{aiBusy=false;if(isHolidayAsk(text)){dialogue.push({role:'assistant',type:'recommendation'})}else if(/大理/.test(text)){dialogue.push({role:'assistant',text:'大理四天可以这样慢慢玩：第一天到达后逛古城，第二天去喜洲和洱海西岸，第三天选择双廊或苍山，第四天留给休息和返程。环海不用一天走完。你更想骑行，还是包车轻松一些？（示例回复）'})}else if(/西安/.test(text)){dialogue.push({role:'assistant',text:'带孩子去西安，可以先考虑陕西历史博物馆、西安博物院，以及秦始皇帝陵博物院。四天内建议一天只安排一个主要参观点，另留时间休息；开放与预约信息需要出行前确认。孩子多大，更喜欢历史故事还是动手体验？（示例回复）'})}else if(/成都/.test(text)){state.idea=text;dialogue.push({role:'assistant',text:'成都亲子四天，我会把节奏放慢：第一天老街喝茶，第二天上午看熊猫、下午休息，第三天武侯祠和锦里，第四天轻松走走再返程。孩子多大？你们准备从哪里出发？',plan:true})}else{dialogue.push({role:'assistant',text:'收到，你的想法我记下了。这一版可以先体验“十一有4天，去哪儿玩？”的目的地推荐，也可以继续聊成都、大理或西安。（模拟回复）'})}if(screen==='dongdong')render()},2300)}
sendDong=function(id){const input=document.getElementById(id);let text=input.value.trim();if(!text||aiBusy)return;input.value='';askDong(text)};

function travelTagList(items){const seen=new Set();return items.filter(t=>t&&t.label&&t.evidence).sort((a,b)=>(b.priority||0)-(a.priority||0)).filter(t=>{const key=t.group||t.label;if(seen.has(key))return false;seen.add(key);return true}).slice(0,3)}
function travelTagMarkup(items){return travelTagList(items).map(t=>`<span title="${esc(t.evidence)}" aria-label="${esc(t.label+'：'+t.evidence)}">${esc(t.label)}</span>`).join('')}
function travelMinute(value){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(value||''))return null;const [h,m]=value.split(':').map(Number);return h*60+m}
function travelFlightTags(kind,f,times,context={}){
  const tags=[],add=(label,evidence,priority=10,group=label)=>tags.push({label,evidence,priority,group});
  const dep=travelMinute(times?.[0]),arr=travelMinute(times?.[1]),sameDay=f.arrivalDayOffset===0&&dep!==null&&arr!==null&&arr>dep;
  const need=kind==='out'?context.outNeeds:context.backNeeds;
  if(f.stops===0)add('直达','示例航班：无中转',30,'route');else if(Number.isInteger(f.stops)&&f.stops>0)add('中转',`需中转 ${f.stops} 次`,30,'route');
  if(sameDay&&arr<720)add('午前抵达',`当前卡片抵达时间 ${times[1]}`,need?.beforeNoon?100:40,'arrival');
  if(sameDay&&dep>=480&&arr<=1320)add('出行时间方便','原型时刻规则：08:00后出发、21:00前当天抵达',20,'schedule');
  else if(sameDay&&dep>=360&&arr<=1380)add('非红眼航班','原型时刻规则：06:00后出发、23:00前当天抵达',15,'schedule');
  if(sameDay)add('当天到达','示例航班到达日期与出发日期相同',5,'arrival');
  if(sameDay&&need?.earlierTime&&arr<travelMinute(need.earlierTime))add('提前到达',`抵达时间 ${times[1]} 早于调整前的 ${need.earlierTime}`,105,'arrival');
  if(sameDay&&need?.earlierDate&&context.date===need.earlierDate)add('提前一天到达','当前去程日期符合该方案已记录的提前一天需求',100,'date');
  const fareVerified=f.fare?.verified&&f.fare.date===context.date&&f.fare.kind===kind&&f.fare.times?.join('|')===times?.join('|');
  if(fareVerified&&f.fare.checkedKg>0)add('含托运行李',`当前票价含托运行李 ${f.fare.checkedKg}kg`,need?.baggage?100:25,'baggage');
  if(fareVerified&&f.fare.mealIncluded===true)add('有餐食',f.fare.mealDescription||'当前票价包含餐食',need?.meal?100:10,'meal');
  if(fareVerified&&f.fare.changeable&&f.fare.changeTerms)add('可退改',f.fare.changeTerms,need?.flexible?100:20,'policy');
  return travelTagList(tags);
}
function travelHotelTags(h,name,room,context={}){
  const tags=[],add=(label,evidence,priority=10,group=label)=>tags.push({label,evidence,priority,group});
  if(name!==h.name)return [];
  if(h.nearby?.name&&h.nearby.minutes>0&&h.nearby.minutes<=15)add('近'+h.nearby.name,`示例位置：步行约 ${h.nearby.minutes} 分钟`,40,'location');
  if(/家庭房/.test(room||''))add('家庭房','当前所选房型为家庭房；入住人数和儿童政策仍需确认',context.hotelNeeds?.familyRoom?100:35,'room');
  if(h.grade?.verified&&h.grade.label&&h.grade.basis)add(h.grade.label,h.grade.basis,20,'grade');
  if(h.rating?.verified&&Number.isFinite(h.rating.threshold)&&Number.isFinite(h.rating.minReviews)&&h.rating.score>=h.rating.threshold&&h.rating.reviews>=h.rating.minReviews)add('高分酒店',`${h.rating.source}：${h.rating.score}分，${h.rating.reviews}条评价`,25,'rating');
  const p=h.package;
  if(p?.verified&&p.room===room&&p.inDate===context.inDate&&p.outDate===context.outDate){
    if(p.breakfastCount>0)add('含早餐',`当前房型套餐含 ${p.breakfastCount} 份早餐`,30,'meal');
    if(p.freeCancelUntil)add('免费取消',`${p.freeCancelUntil} 前免费取消；${p.cancelTerms||'逾期费用以下单页为准'}`,30,'policy');
  }
  return travelTagList(tags);
}
function travelFlightNotice(kind,f,times,context={}){
  const need=kind==='out'?context.outNeeds:context.backNeeds;if(!need)return '';
  const arr=travelMinute(times?.[1]),dep=travelMinute(times?.[0]),sameDay=f.arrivalDayOffset===0&&arr!==null&&dep!==null&&arr>dep,notes=[];
  if(need.beforeNoon&&!(sameDay&&arr<720))notes.push('未满足午前抵达要求');
  if(need.earlierTime&&!(sameDay&&arr<travelMinute(need.earlierTime)))notes.push('未满足提前抵达要求');
  if(need.earlierDate&&!(sameDay&&context.date===need.earlierDate))notes.push('未满足提前一天到达要求');

  return notes.length?`<p class="booking-pending">${esc(notes.join(' · '))}</p>`:'';
}
function familyDateLabel(raw){const m=String(raw).match(/(\d+)\s*月\s*(\d+)\s*日/);if(!m)return raw;const month=+m[1],day=+m[2],week=['周日','周一','周二','周三','周四','周五','周六'][new Date(2026,month-1,day).getDay()];return `${month}月${String(day).padStart(2,'0')}日 ${week}`}

function travelThemeTags(key,tripDays,context={}){
  const days=Array.isArray(tripDays)?tripDays:[],spots=days.flatMap(d=>d.stops||[]).filter(s=>s.type==='spot'&&s.meta),ids=new Set(spots.map(s=>s.meta)),tags=[];
  const add=(label,evidence,priority,group)=>tags.push({label,evidence,priority,group});
  if(context.children>0)add('亲子出行','该行程明确包含儿童同行',100,'audience');
  else if(context.audience==='couple')add('情侣出游','该行程已记录情侣同行需求',100,'audience');
  else if(context.audience==='elders')add('带长辈','该行程已记录长辈同行需求',100,'audience');
  if(key==='sanya'&&['sy1','sy2','sy3','sy4'].some(id=>ids.has(id)))add('海岛度假','实际行程包含海湾或海岛游览',60,'purpose');
  if(['wuhou','dufu','sy5'].some(id=>ids.has(id)))add('人文古迹','实际行程包含文化古迹游览',50,'purpose');
  if(spots.length&&days.every(d=>{const list=(d.stops||[]).filter(s=>s.type==='spot');return list.length<=2&&list.every(s=>EV_META[s.meta]?.minutes>0)&&list.reduce((sum,s)=>sum+EV_META[s.meta].minutes,0)<=300}))add('轻松慢游','按景点密度：每天最多2处、游览合计不超过5小时；未含交通及排队',55,'pace');
  return travelTagList(tags);
}

}

function evRouteOverview(key,headingId='ev-route-heading',tripDays=evStore[key].days){
  const spots=tripDays.flatMap(d=>d.stops).filter(s=>s.type==='spot');
  const identity=s=>s.meta||evTitle(s);
  // Keep later return visits; only merge consecutive visits to the same place.
  const route=spots.filter((s,i)=>!i||identity(s)!==identity(spots[i-1]));
  const unique=new Set(spots.map(identity));
  const counts=tripDays.map(d=>new Set(d.stops.filter(s=>s.type==='spot').map(identity)).size);
  const themes=key==='sanya'
    ? [{name:'海湾漫步',ids:['sy1','sy2','sy3']},{name:'海岛体验',ids:['sy4']},{name:'山海人文',ids:['sy5','sy6']}]
    : [{name:'街巷人文',ids:['kuanzhai','wuhou','dufu']},{name:'熊猫探访',ids:['panda']},{name:'城市闲逛',ids:['park','city']}];
  const selected=themes.filter(t=>t.ids.some(id=>unique.has(id))).slice(0,2);
  const city=key==='sanya'?'三亚':'成都';
  const dayCount=tripDays.length;
  const heading=`${city}${dayCount?`${dayCount===4?'四':dayCount}天`:''}${key==='sanya'?'海岛假期':'慢旅行'}`;
  const startDate=tripDays[0]?.date,endDate=tripDays.at(-1)?.date;
  const dateRange=startDate&&endDate?(startDate===endDate?startDate:`${startDate} — ${endDate}`):'';
  const dates=[dateRange,dayCount?`${dayCount}天`:''].filter(Boolean).join(' · ');
  const reasons=selected.length?[`涵盖${selected.map(t=>t.name).join('与')}等经典体验`]:[];
  const pandaDay=tripDays.find(d=>d.stops.some(s=>s.type==='spot'&&s.meta==='panda'));
  const island=spots.find(s=>s.meta==='sy4');
  if(pandaDay&&pandaDay.stops.filter(s=>s.type==='spot').length===1){
    reasons.push('熊猫基地当天不叠加其他景点，避免同日多点赶场');
  }else if(island&&(island.duration||EV_META.sy4.minutes)>=300){
    reasons.push(`蜈支洲岛预留${evLength(island.duration||EV_META.sy4.minutes)}，集中体验海岛风光`);
  }else if(counts.length>1&&counts.at(-1)>0&&counts.at(-1)<Math.max(...counts.slice(0,-1))){
    reasons.push('最后一天少排景点，将更多游览安排在前几天');
  }else if(spots.length&&counts.some(n=>n===0)){
    reasons.push('留出未排景点的日期，方便自由安排');
  }

  return `<section class="ev-route-overview ev-route-card" aria-labelledby="${esc(headingId)}"><h2 id="${esc(headingId)}">${esc(heading)}</h2>${dates?`<p class="ev-route-meta">${esc(dates)}</p>`:''}<span class="ev-route-label">本次旅途路线</span><p class="ev-route-path">${path||'暂未安排景点'}</p>${reason?`<p class="ev-route-reason"><strong>推荐理由</strong>${esc(reason)}</p>`:''}</section>`;
}

function dongTripDays(key,days=evStore[key].days){
  const rows=days.map((d,i)=>{
    const stops=d.stops.filter(s=>s.type==='spot'||s.type==='rest'||s.anchor);
    const route=stops.map(s=>s.anchor==='arrival'?'抵达安顿':s.anchor==='departure'?'返程':evTitle(s)).filter((t,j,a)=>j===0||t!==a[j-1]).join(' → ');
    const spots=d.stops.filter(s=>s.type==='spot');
    const metas=new Set(spots.map(s=>s.meta));
    let note='按相邻片区顺路串联，减少折返。';
    if(!spots.length)note='预留自由时间，方便临时调整。';
    else if(stops.some(s=>s.anchor))note='配合抵达与返程时间，减少等待。';
    else if(spots.length===1&&spots[0].meta==='panda')note='错峰看熊猫，下午留给休息。';
    else if(d.stops.some(s=>s.type==='rest'))note='穿插休息，避免连续赶路。';
    else if(i===days.length-1)note='少排一站，为返程留足时间。';
    else if(metas.has('kuanzhai')&&metas.has('park'))note='两处距离较近，徒步衔接更轻松。';
    else if(metas.has('wuhou')&&metas.has('city'))note='人文景点与商圈顺路衔接。';
    return `<li class="dong-trip-day"><span class="dong-day-badge">DAY${i+1}</span><div><p class="dong-day-route">${esc(route||'自由安排')}</p><p class="dong-day-note">${esc(note)}</p></div></li>`;
  }).join('');
  return `<section class="dong-trip-days" aria-label="每日行程安排"><ol>${rows}</ol>${days.length?'':'<p class="dong-day-note">暂未安排出行日期</p>'}</section>`;
}

/* ===== 地图自适应取景：按景点分布计算 viewBox，避开弹层遮挡区 ===== */
function evMapFit(){
  const base=document.querySelector('.ev-base');
  const svg=base&&base.querySelector('.ev-map>svg');
  if(!svg)return;
  const box=base.getBoundingClientRect();
  if(!box.width||!box.height)return;
  const dots=[...svg.querySelectorAll('g circle')];
  if(!dots.length)return;
  const xs=dots.map(c=>+c.getAttribute('cx')),ys=dots.map(c=>+c.getAttribute('cy'));
  let x0=Math.min(...xs)-64,x1=Math.max(...xs)+64,y0=Math.min(...ys)-40,y1=Math.max(...ys)+54;
  let w=x1-x0,h=y1-y0;
  if(w<230){x0-=(230-w)/2;w=230}
  if(h<170){y0-=(170-h)/2;h=170}
  const sheet=document.querySelector('.ev-sheet');
  const sh=sheet?sheet.getBoundingClientRect().height:0;
  const visH=Math.max(190,box.height-sh+26);
  const arVis=box.width/visH;
  if(w/h<arVis){const nw=h*arVis;x0-=(nw-w)/2;w=nw}
  else{const nh=w/arVis;y0-=(nh-h)/2;h=nh}
  const htotal=h*box.height/visH;
  svg.setAttribute('viewBox',x0+' '+y0+' '+w+' '+htotal);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const pad=Math.max(w,htotal);
  const bg=svg.querySelector('rect');
  if(bg){bg.setAttribute('x',x0-pad);bg.setAttribute('y',y0-pad);bg.setAttribute('width',w+pad*2);bg.setAttribute('height',htotal+pad*2)}
  const grid=svg.querySelector('path');
  if(grid){
    const gx0=x0-pad,gx1=x0+w+pad,gy0=y0-pad,gy1=y0+htotal+pad;
    let d='';
    for(let y=Math.ceil(gy0/65)*65;y<gy1;y+=65)d+='M'+gx0+' '+y+'H'+gx1;
    for(let x=Math.ceil(gx0/72)*72;x<gx1;x+=72)d+='M'+x+' '+gy0+'V'+gy1;
    grid.setAttribute('d',d);
  }
}

rvPlan=function(){

    let source=evClone(s.base.days);
    if(!s.sameDates){source=source.map(d=>({...d,day:d.day+1}));source.unshift({day:1,date:s.candidate.booking.outDate,theme:'提前抵达 · 入住休息',stops:[{uid:'rv-rest',type:'rest',anchor:null,title:'酒店寄存行李 / 入住与自由活动',desc:'入住时间与房型需确认',meta:null}]})}
    let days=pbAnchored(s.candidate,source),moves=[];
    // Only candidate days are rearranged. Never remove attractions to hide conflicts.
    for(let pass=0;pass<30;pass++){
      const bad=days.find(d=>evSchedule(d).issues.length);if(!bad)break;
      const stop=[...bad.stops].reverse().find(x=>x.type==='spot');if(!stop)break;
      let target=null;
      for(const d of days){if(d===bad)continue;const trial=evClone(d),index=trial.stops.findIndex(x=>x.anchor==='departure');trial.stops.splice(index<0?trial.stops.length:index,0,stop);if(!evSchedule(trial).issues.length){target=d;break}}
      if(!target)break;
      bad.stops.splice(bad.stops.indexOf(stop),1);const index=target.stops.findIndex(x=>x.anchor==='departure');target.stops.splice(index<0?target.stops.length:index,0,stop);moves.push((EV_META[stop.meta]?.name||stop.title)+'：DAY '+bad.day+' → DAY '+target.day);
    }
    const issues=days.flatMap(d=>evSchedule(d).issues.map(x=>'DAY '+d.day+'：'+x));
    if(issues.length){s.stage='booking-confirmed';rvReply('这些景点暂时无法全部排入当前航班时间：'+issues.join('；')+'。没有删除景点或覆盖原方案。可保留原方案，自行调整后再试。',['返回预订清单','先保留原方案'],{session:s.id});return}
    s.candidate.days=days;s.candidate.booking.delta=0;if(!rvValid(s.candidate))throw Error('Invalid candidate');s.stage='plan';
    rvReply('完整候选规划已生成，抵达后留60分钟、返程提前120分钟。'+(moves.length?'为避开时间冲突，建议调整：'+moves.join('；')+'。':'保留全部景点及原有景点日期。')+'酒店接驳仍需按实际地址核实；这只是候选，采用后才同步机酒和行程。',['采用这版方案','先保留原方案'],{session:s.id,kind:'plan',snapshot:evClone(s.candidate)});
  });
};
rvAdopt=function(){
  const s=rvSession;if(!s||!['plan','save-failed'].includes(s.stage))return;
  if(!pbApply(s.candidate,s.base)){s.stage=pbUI.error.includes('已有变化')?'stale':'save-failed';rvSay(pbUI.error,s.stage==='stale'?['返回预订清单']:['重试采用','先保留原方案']);return}
  s.stage='adopted';evActive.chengdu=0;pbUI.context=null;
  rvReply('已采用这版：'+s.candidate.booking.outDate+'抵达，'+s.candidate.booking.backDate+'返程，'+s.candidate.days.length+'天'+s.candidate.booking.nights+'晚。行程与机酒已一起保存。未下单、未扣款。',['查看更新后的行程','查看上一版'],{kind:'adopted',snapshot:evClone(s.candidate)});rvPaint();
};
const pbOldReply=rvBookingReply;
rvBookingReply=function(s){pbOldReply(s);const m=dialogue.at(-1);m.choices=['确认这组候选机酒','去程想再早一点','先保留原方案'];m.followup='先确认候选机酒，再单独生成完整规划；采用整版后才更新当前行程。'};
const pbOldRvChoose=rvChoose;
rvChoose=function(kind,index,id,messageIndex){
  if(!rvSession?.sameDates){pbOldRvChoose(kind,index,id,messageIndex);return}
  const s=rvSession,m=dialogue[messageIndex];
  if(aiBusy||s.id!==id||s.stage!=='booking'||m?.session!==id||messageIndex!==dialogue.findLastIndex(x=>x.kind==='booking'&&x.session===id)||!pbKinds[kind]||!Number.isInteger(index)||index<0||index>2)return;
  const b=s.candidate.booking,f=familyFlights[index],h=familyHotels[index];b.selection[kind]=index;
  if(kind==='hotel'){b.hotel=h.name;b.room=h.room;b.hotelPrice=Math.round(h.price*b.nights/3)}else{b[kind]=evClone(kind==='out'&&b.nights===4?b.out:f[kind]);b[kind==='out'?'outPorts':'backPorts']=kind==='out'?evClone(f.ports):[...f.ports].reverse()}
  b.adultPrice=2*(familyFlights[b.selection.out].op+familyFlights[b.selection.back].bp)+(b.outExtra||0);b.delta=b.adultPrice+b.hotelPrice-s.base.booking.adultPrice-s.base.booking.hotelPrice;m.snapshot=evClone(s.candidate);render();
};
const pbOldAsk=askDong;
askDong=function(text){
  const t=text.trim();if(!t||aiBusy)return;
  if(t==='返回预订清单'){pbReturn();return}
  if(t==='查看更新后的行程'){go('plan');return}
  if(t==='再推荐一组机酒'){
    dialogue.push({role:'user',text:t});familyBooking={out:(familyBooking.out+1)%3,back:(familyBooking.back+1)%3,hotel:(familyBooking.hotel+1)%3};
    const model=pbModel('chengdu');model.draft=pbBase(familyBooking);pbPersist();dialogue.push({role:'assistant',type:'family-booking',snapshot:evClone(model.draft)});render();return;
  }
  if(t==='按北京出发、2大2小体验模拟推荐'){
    dialogue.push({role:'user',text:t});const m=pbModel('chengdu');if(!m.confirmed&&!m.draft){m.draft=pbBase();pbPersist()}
    dialogue.push({role:'assistant',type:'family-booking',snapshot:evClone(m.draft||m.confirmed)});rvSay('这里保留三行九张推荐卡作为参考。到预订清单点选、比较和确认；推荐不等于已确认。',['返回预订清单']);return;
  }
  const s=rvSession;
  if(s&&pbPending()){
    if(/先保留|不改了|取消|暂不|不要调整/.test(t)){s.stage='cancelled';dialogue.push({role:'user',text:t});rvSay('已取消本次候选，当前机酒与行程保持不变。',['返回预订清单']);return}
    if(s.stage==='booking'&&/确认|按这组|这组.*(可以|行)|^(可以|好的|就这个|行|没有|没有了|没有其他要求)/.test(t)){
      dialogue.push({role:'user',text:t});s.stage='booking-confirmed';rvSay('已确认这组候选机酒，但还没有采用。下一步生成完整规划，供你看完后决定。',['生成完整候选规划','先保留原方案']);return;
    }
    if(s.stage==='booking-confirmed'&&/生成|规划|安排|^(可以|好的)$/.test(t)){dialogue.push({role:'user',text:t});rvPlan();return}
    if(s.stage==='booking-confirmed'&&/(更早|再早|早一点)/.test(t)&&!s.sameDates){s.early=true;rvMatch();return}
    if(['plan','save-failed'].includes(s.stage)&&/采用|就用这版|用新版|^(可以|好的|确认)$/.test(t)){dialogue.push({role:'user',text:t});rvAdopt();return}
    if(s.stage==='failed'&&/重试/.test(t)){if(s.retry==='plan'){s.stage='booking-confirmed';rvPlan()}else rvMatch();return}
  }
  if(pbUI.context&&!pbModel(pbUI.context.key).confirmed&&!pbModel(pbUI.context.key).draft&&!/(提前|早)(一|1)天/.test(t)){
    dialogue.push({role:'user',text:t});rvSay('已收到你的条件，但当前原型不能查询这组条件的真实商品。只支持明确选择北京往返成都、两大两小的示例，不会替换成不符合要求的推荐。',pbUI.context.key==='chengdu'?['按北京出发、2大2小体验模拟推荐','返回预订清单']:['返回预订清单']);return;
  }
  pbOldAsk(text);
};
const pbOldDong=views.dongdong;
views.dongdong=function(){dialogue.forEach(m=>{if(m.type==='family-booking'&&!m.snapshot)m.snapshot=evClone(pbModel('chengdu').draft||pbModel('chengdu').confirmed||pbBase())});return pbOldDong()};
const pbOldMessage=rvMessage;
rvMessage=function(m,i){if(m.kind==='history-booking')return '<section class="ai-recommend"><div class="ai-byline">✧ <strong>东东帮你搭配机酒</strong></div><p class="ai-overview">我按北京出发、10月1日至4日、2大2小的条件，优先挑了时间合适的直飞航班，以及靠近市区行程的酒店。每一项都可以单独更换，先看看这组搭配是否合适。</p>'+rvBookingCard(m.snapshot,'')+'<div class="natural-followup booking-followup"><p>这组机酒你觉得合适吗？如果想调整航班时间、酒店位置或房型，直接告诉我就好。</p></div><div class="ai-followups booking-followup-chips"><button type="button" onclick="askDong(\'我想早一天出发\')"><span>✧</span>想早一天出发</button><button type="button" onclick="askDong(\'再推荐一组机酒\')"><span>✧</span>再推荐一组机酒</button></div></section>';return pbOldMessage(m,i)};
function pbStartOrder(kind){
  const m=pbModel();if(!m.confirmed||m.draft){pbUI.error='请先完成更换确认，待选商品不能预订。';pbPaint();return}
  pbUI.order={kind,stage:'info',booking:evClone(m.confirmed.booking),values:{ageA:'',ageB:'',rooms:'1'}};pbUI.error='';pbPaint();document.querySelector('.ev-sheet-scroll').scrollTop=0;
}
function pbOrderMarkup(){
  const o=pbUI.order,b=o.booking,hotel=o.kind==='hotel',v=o.values;
  let h='<div class="pb-notice"><h3>'+pbKinds[o.kind]+' · 模拟预订</h3><p>'+esc(hotel?b.hotel+' · '+b.room+' · '+b.outDate+'至'+b.backDate:(o.kind==='out'?'北京 → 成都':'成都 → 北京')+' · '+b[o.kind+'Date']+' · '+b[o.kind].join('—'))+'</p></div>';
  if(o.stage==='info')h+=`<form class="pb-form" onsubmit="event.preventDefault();pbOrderNext(this)"><p class="pb-note">沿用示例2位成人、2位儿童。使用成人A/B、儿童A/B演示称呼，不收集真实姓名、证件或电话。只补充本次模拟缺少的信息。</p><label>儿童A年龄（0—17岁）<input name="ageA" type="number" min="0" max="17" step="1" value="${esc(v.ageA)}" required></label><label>儿童B年龄（0—17岁）<input name="ageB" type="number" min="0" max="17" step="1" value="${esc(v.ageB)}" required></label>${hotel?'<label>计划房间数<select name="rooms"><option value="1">1间（能否入住4人待核实）</option><option value="2">2间（需重新报价）</option></select></label>':''}<button class="primary gap" type="submit">查看价格、库存与退改说明</button></form>`;
  else if(o.stage==='rules')h+=`<div class="pb-notice"><h3>下单前核对（演示）</h3><p>儿童年龄：${v.ageA}岁、${v.ageB}岁。${hotel?'计划'+v.rooms+'间房。':''}</p><p>${hotel?'当前仅有1间 / '+b.nights+'晚参考价 ¥'+b.hotelPrice+'；选择2间不能直接按倍数认定报价，房型人数与早餐待核实。':'成人单程参考价 ¥'+(familyFlights[b.selection[o.kind]][o.kind==='out'?'op':'bp']+(o.kind==='out'?(b.outExtra||0)/2:0))+'；儿童票与婴儿票尚未报价。'}</p><p>未查询实时价格与库存；行李、退改、入住资格与其他规则均未获得真实确认。</p><p>此处不能支付，不生成订单，也不表示商品已锁定。</p><button class="primary" onclick="pbUI.order.stage='done';pbPaint()">完成本次模拟</button><button class="text gap" onclick="pbUI.order.stage='info';pbPaint()">返回补充信息</button></div>`;
  else h+='<div class="pb-empty"><h3>本次模拟已结束</h3><p>没有真实订单、没有支付或扣款，也没有锁定库存。其他商品需分别预订。</p></div>';
  return h+'<button class="text gap" onclick="pbUI.order=null;pbUI.error=\'\';pbPaint()">返回预订清单</button>'+(pbUI.error?'<p class="pb-error">'+esc(pbUI.error)+'</p>':'');
}
function pbOrderNext(form){
  if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));
  if(!['ageA','ageB'].every(k=>values[k]!==''&&Number.isInteger(+values[k])&&+values[k]>=0&&+values[k]<=17)){pbUI.error='请填写0—17之间的整数年龄';pbPaint();return}
  pbUI.order.values={...values,rooms:values.rooms||'1'};pbUI.order.stage='rules';pbUI.error='';pbPaint();
}
render();

</script></body></html>
